name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Build und Core-Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prüfwerkzeuge für die Formattests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools mtools e2fsprogs gdisk fdisk xorriso nasm qemu-system-x86 ovmf p7zip-full udftools parted xz-utils zstd bzip2 gzip
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Bootrix.slnx -c Release
      - run: dotnet test tests/Bootrix.Core.Tests -c Release --no-build

  windows:
    name: Build, Tests und Publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Bootrix.slnx -c Release
      - run: dotnet test Bootrix.slnx -c Release --no-build
      - name: Publish (x64)
        run: |
          dotnet publish src/Bootrix.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/win-x64
          dotnet publish src/Bootrix.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/win-x64
      - name: GUI smoke test
        shell: pwsh
        run: |
          $process = Start-Process artifacts/win-x64/Bootrix.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'The GUI smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content artifacts/win-x64/smoke-test-error.txt -ErrorAction SilentlyContinue
            throw "The GUI smoke test failed with exit code $($process.ExitCode)."
          }
      - name: CLI smoke test
        shell: pwsh
        run: |
          artifacts/win-x64/bootrix-cli.exe tiny profiles
          artifacts/win-x64/bootrix-cli.exe disks --all --json
      - uses: actions/upload-artifact@v4
        with:
          name: bootrix-win-x64
          path: artifacts/win-x64
